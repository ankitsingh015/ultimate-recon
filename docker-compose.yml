version: "3.9"

services:
  ultimate-recon:
    build:
      context: .
      dockerfile: Dockerfile
    image: ultimate-recon:latest
    container_name: ultimate-recon
    network_mode: host
    volumes:
      - ./output:/opt/ultimate-recon/output
      - ./config:/opt/ultimate-recon/config
      - ./wordlists:/opt/ultimate-recon/wordlists
    environment:
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color
    stdin_open: true
    tty: true
    command: ["--help"]
