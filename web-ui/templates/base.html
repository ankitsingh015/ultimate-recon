<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ultimate Recon{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; }
.nav { background: #12121e; border-bottom: 1px solid #2a2a3e; padding: 12px 24px; display: flex; gap: 20px; align-items: center; }
.nav a { color: #00ff88; text-decoration: none; font-size: 14px; }
.nav a:hover { text-decoration: underline; }
.nav .title { color: #fff; font-weight: bold; font-size: 16px; margin-right: auto; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.card { background: #12121e; border: 1px solid #2a2a3e; border-radius: 10px; padding: 20px; margin: 12px 0; }
.card h2 { color: #00ff88; font-size: 14px; text-transform: uppercase; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #1a1a2e; }
th { color: #00ff88; font-size: 11px; text-transform: uppercase; }
tr:hover { background: #1a1a2e; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-critical { background: #441; color: #f44; }
.badge-high { background: #442; color: #f80; }
.badge-medium { background: #443; color: #fc0; }
.badge-low { background: #144; color: #6cf; }
.btn { display: inline-block; padding: 8px 16px; border-radius: 6px; background: #00ff88; color: #000; text-decoration: none; font-size: 13px; font-weight: bold; border: none; cursor: pointer; }
.btn:hover { opacity: 0.9; }
pre { background: #0a0a0f; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; max-height: 400px; }
.footer { text-align: center; padding: 30px; color: #444; font-size: 12px; }
</style>
</head>
<body>
<nav class="nav">
    <span class="title">⚡ Ultimate Recon</span>
    <a href="/">Workspaces</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<div class="footer">Ultimate Recon v1.0</div>
</body>
</html>
